<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Office Signup — ERP</title>
    <link rel="stylesheet" href="office/css/common.css">
    <link rel="stylesheet" href="office/css/login.css">
</head>
<body>
    <div class="login-page">
        <div class="login-card">
            <div class="login-logo">
                <div class="logo-icon">G</div>
                <h1>Create Office Account</h1>
                <p>Register a new office user</p>
            </div>

            <div class="login-error" id="signup-error"></div>

            <form class="login-form" id="signup-form" autocomplete="off">
                <div class="form-group">
                    <label class="form-label" for="full-name">Full Name</label>
                    <input type="text" id="full-name" class="form-input" placeholder="Enter your full name" required>
                </div>
                <div class="form-group">
                    <label class="form-label" for="email">Email</label>
                    <input type="email" id="email" class="form-input" placeholder="Enter your email" required>
                </div>
                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" class="form-input" placeholder="Minimum 6 characters" required minlength="6">
                        <button type="button" class="password-toggle" onclick="togglePassword()">👁</button>
                    </div>
                </div>
                <button type="submit" class="login-btn" id="signup-btn">Create Account</button>
            </form>

            <div class="login-footer">
                Already have an account? <a href="office/login.html">Login here</a>
            </div>
        </div>
    </div>

    <script src="assets/js/supabase.js"></script>
    <script src="assets/shared/helpers.js"></script>
    <script src="assets/shared/ui.js"></script>
    <script>
        function togglePassword() {
            var p = document.getElementById('password');
            p.type = p.type === 'password' ? 'text' : 'password';
        }

        document.getElementById('signup-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            var errEl = document.getElementById('signup-error');
            errEl.style.display = 'none';

            var name = document.getElementById('full-name').value.trim();
            var email = document.getElementById('email').value.trim();
            var password = document.getElementById('password').value;

            if (!name || !email || !password) {
                errEl.textContent = 'All fields are required.';
                errEl.style.display = 'block';
                return;
            }

            if (!isValidEmail(email)) {
                errEl.textContent = 'Enter a valid email address.';
                errEl.style.display = 'block';
                return;
            }

            if (password.length < 6) {
                errEl.textContent = 'Password must be at least 6 characters.';
                errEl.style.display = 'block';
                return;
            }

            var btn = document.getElementById('signup-btn');
            btnLoading(btn, true);

            try {
                var data = await signUp(email, password);

                /* Create office user profile */
                if (data.user) {
                    try {
                        await dbInsert('office_users', {
                            id: data.user.id,
                            full_name: name,
                            role: 'office'
                        });
                    } catch (profileErr) {
                        console.warn('Profile creation deferred:', profileErr.message);
                    }
                }

                showToast('Account created! Check your email for confirmation.', 'success');
                setTimeout(function() {
                    window.location.href = 'office/login.html';
                }, 2000);
            } catch (err) {
                errEl.textContent = err.message || 'Signup failed. Please try again.';
                errEl.style.display = 'block';
                btnLoading(btn, false, 'Create Account');
            }
        });
    </script>
</body>
</html>
