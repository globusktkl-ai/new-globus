<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Attendance — ERP</title>
    <link rel="stylesheet" href="css/teacher.css">
    <link rel="stylesheet" href="css/attendance.css">
</head>
<body>
    <nav class="teacher-nav">
        <div class="nav-content">
            <div class="nav-left">
                <div class="nav-icon">📋</div>
                <div>
                    <div class="nav-title">Attendance</div>
                    <div class="nav-subtitle" id="nav-subtitle">Mark Daily Attendance</div>
                </div>
            </div>
            <div class="nav-actions">
                <a href="dashboard.html" class="nav-btn">← Dashboard</a>
            </div>
        </div>
    </nav>

    <div class="teacher-container" style="padding-bottom:100px;">
        <!-- Date Selector -->
        <div class="date-selector">
            <button class="date-nav-btn" id="prev-date">←</button>
            <div>
                <label>Date:</label>
                <input type="date" id="attendance-date">
            </div>
            <button class="date-nav-btn" id="next-date">→</button>
            <button class="btn btn-sm btn-outline" id="today-btn">Today</button>
        </div>

        <!-- Summary Bar -->
        <div class="attendance-summary-bar" id="summary-bar"></div>

        <!-- Attendance List -->
        <div class="attendance-list">
            <div class="attendance-header">
                <h3 id="list-title">Students</h3>
                <div class="bulk-actions">
                    <button class="bulk-btn present" onclick="markAll('Present')">All Present</button>
                    <button class="bulk-btn absent" onclick="markAll('Absent')">All Absent</button>
                    <button class="bulk-btn leave" onclick="markAll('Leave')">All Leave</button>
                </div>
            </div>
            <div id="attendance-rows"></div>
        </div>
    </div>

    <!-- Save Bar -->
    <div class="save-attendance-bar">
        <button class="btn btn-success" id="save-btn" onclick="saveAttendance()">💾 Save Attendance</button>
        <button class="btn btn-secondary" onclick="resetAttendance()">↺ Reset</button>
    </div>

    <script src="../assets/js/supabase.js"></script>
    <script src="../assets/shared/helpers.js"></script>
    <script src="../assets/shared/ui.js"></script>
    <script src="../assets/shared/components.js"></script>
    <script src="js/attendance.js"></script>
</body>
</html>
