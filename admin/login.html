<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Admin Login — ERP</title>
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>
    <div class="login-page">
        <div class="login-card">
            <div class="login-logo">
                <div class="logo-icon">⚙️</div>
                <h1>Admin Portal</h1>
                <p>Enterprise Management System</p>
            </div>

            <div class="login-error" id="login-error"></div>

            <form class="login-form" id="login-form" autocomplete="off">
                <div class="form-group">
                    <label class="form-label" for="email">Email</label>
                    <input type="email" id="email" class="form-input" placeholder="admin@example.com" required autocomplete="email">
                </div>
                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" class="form-input" placeholder="Enter password" required autocomplete="current-password">
                        <button type="button" class="password-toggle" id="pwd-toggle">👁</button>
                    </div>
                </div>
                <div class="remember-row">
                    <input type="checkbox" id="remember" checked>
                    <label for="remember">Remember me</label>
                </div>
                <button type="submit" class="login-btn" id="login-btn">Sign In</button>
            </form>

            <p style="text-align:center;margin-top:24px;font-size:13px;color:#888;">
                <a href="../index.html">← Back to Home</a>
            </p>
        </div>
    </div>

    <script src="../assets/js/supabase.js"></script>
    <script src="../assets/shared/helpers.js"></script>
    <script src="../assets/shared/ui.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
