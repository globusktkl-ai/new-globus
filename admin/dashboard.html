<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Admin Dashboard — ERP</title>
    <link rel="stylesheet" href="css/admin.css">
    <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="admin-nav">
        <div class="nav-content">
            <div class="nav-brand">
                <div class="nav-logo">⚙️</div>
                <div>
                    <div class="nav-title" id="nav-title">Admin Portal</div>
                    <div class="nav-subtitle">Enterprise Management</div>
                </div>
            </div>
            <button class="mobile-menu-toggle" onclick="toggleMenu()">☰</button>
            <div class="nav-menu" id="nav-menu">
                <a href="dashboard.html" class="nav-link active">Dashboard</a>
                <a href="students.html" class="nav-link">Students</a>
                <a href="teachers.html" class="nav-link">Teachers</a>
                <a href="reports.html" class="nav-link">Reports</a>
                <a href="settings.html" class="nav-link">Settings</a>
                <button class="nav-btn" onclick="handleLogout()">Logout</button>
            </div>
        </div>
    </nav>

    <div class="admin-container">
        <!-- Welcome Banner -->
        <div class="welcome-banner">
            <div class="welcome-content">
                <h2 id="welcome-text">Welcome, Admin</h2>
                <p id="institute-name">Globus Technical Academy</p>
            </div>
            <div class="welcome-date" id="current-date"></div>
        </div>

        <!-- Stats Grid -->
        <div class="stats-grid" id="stats-grid"></div>

        <!-- Quick Actions -->
        <h3 style="font-size:16px;color:#888;margin-bottom:16px;font-weight:600;">Quick Actions</h3>
        <div class="quick-actions" id="quick-actions"></div>

        <!-- Dashboard Grid -->
        <div class="dashboard-grid">
            <!-- Charts -->
            <div>
                <div class="chart-card">
                    <div class="chart-header">
                        <h3>📈 Monthly Admissions</h3>
                    </div>
                    <div class="bar-chart" id="admissions-chart"></div>
                </div>

                <div class="chart-card">
                    <div class="chart-header">
                        <h3>💰 Revenue Trend</h3>
                    </div>
                    <div class="bar-chart" id="revenue-chart"></div>
                </div>
            </div>

            <!-- Recent Activity -->
            <div>
                <div class="card">
                    <div class="card-header">
                        <span class="card-title">🕐 Recent Activity</span>
                        <a href="activity-logs.html" class="btn btn-sm btn-secondary">View All</a>
                    </div>
                    <div class="activity-list" id="activity-list"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="../assets/js/supabase.js"></script>
    <script src="../assets/shared/helpers.js"></script>
    <script src="../assets/shared/ui.js"></script>
    <script src="../assets/shared/components.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
