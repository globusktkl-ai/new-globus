<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Backup — ERP Admin</title>
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>
    <nav class="admin-nav">
        <div class="nav-content">
            <div class="nav-brand">
                <div class="nav-logo">💾</div>
                <div><div class="nav-title">Backup & Restore</div><div class="nav-subtitle">Admin Portal</div></div>
            </div>
            <div class="nav-menu">
                <a href="dashboard.html" class="nav-link">Dashboard</a>
                <button class="nav-btn" onclick="handleLogout()">Logout</button>
            </div>
        </div>
    </nav>

    <div class="admin-container">
        <div class="page-header">
            <h1>💾 Backup & Restore</h1>
        </div>

        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px;margin-bottom:24px;">
            <div class="card" style="text-align:center;">
                <div style="font-size:48px;margin-bottom:16px;">📥</div>
                <h3 style="font-size:18px;margin-bottom:8px;">Export Students</h3>
                <p style="font-size:14px;color:#888;margin-bottom:16px;">Download all student data as CSV</p>
                <button class="btn btn-primary btn-block" onclick="exportStudents()">Download CSV</button>
            </div>
            <div class="card" style="text-align:center;">
                <div style="font-size:48px;margin-bottom:16px;">💰</div>
                <h3 style="font-size:18px;margin-bottom:8px;">Export Payments</h3>
                <p style="font-size:14px;color:#888;margin-bottom:16px;">Download all payment records</p>
                <button class="btn btn-primary btn-block" onclick="exportPayments()">Download CSV</button>
            </div>
            <div class="card" style="text-align:center;">
                <div style="font-size:48px;margin-bottom:16px;">📋</div>
                <h3 style="font-size:18px;margin-bottom:8px;">Export Attendance</h3>
                <p style="font-size:14px;color:#888;margin-bottom:16px;">Download attendance records</p>
                <button class="btn btn-primary btn-block" onclick="exportAttendance()">Download CSV</button>
            </div>
            <div class="card" style="text-align:center;">
                <div style="font-size:48px;margin-bottom:16px;">⚙️</div>
                <h3 style="font-size:18px;margin-bottom:8px;">Export Settings</h3>
                <p style="font-size:14px;color:#888;margin-bottom:16px;">Download system settings</p>
                <button class="btn btn-secondary btn-block" onclick="exportSettings()">Download JSON</button>
            </div>
        </div>

        <div class="card">
            <h3 style="margin-bottom:16px;">📜 Backup History</h3>
            <div id="backup-history"></div>
        </div>
    </div>

    <script src="../assets/js/supabase.js"></script>
    <script src="../assets/shared/helpers.js"></script>
    <script src="../assets/shared/ui.js"></script>
    <script src="js/backup.js"></script>
</body>
</html>
