<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Office Users — ERP Admin</title>
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>
    <nav class="admin-nav">
        <div class="nav-content">
            <div class="nav-brand">
                <div class="nav-logo">🏢</div>
                <div><div class="nav-title">Office User Management</div><div class="nav-subtitle">Admin Portal</div></div>
            </div>
            <div class="nav-menu">
                <a href="dashboard.html" class="nav-link">Dashboard</a>
                <button class="nav-btn" onclick="handleLogout()">Logout</button>
            </div>
        </div>
    </nav>
    <div class="admin-container">
        <div class="page-header"><h1>🏢 Office Users</h1></div>
        <div class="card"><p style="color:#888;">Office users are managed through Supabase Auth. Use the signup page to create new office accounts, then update their role in the office_users table.</p>
        <a href="../signup.html" class="btn btn-primary" target="_blank">➕ Create Office Account</a></div>
        <div id="users-list"></div>
    </div>
    <script src="../assets/js/supabase.js"></script>
    <script src="../assets/shared/helpers.js"></script>
    <script src="../assets/shared/ui.js"></script>
    <script>
        var ADMIN_SESSION_KEY = 'erp_admin_session';
        window.handleLogout = async function () {
            try { await signOut(); } catch (e) { }
            localStorage.removeItem(ADMIN_SESSION_KEY);
            window.location.replace('login.html');
        };
        async function init() {
            var admin = JSON.parse(localStorage.getItem(ADMIN_SESSION_KEY) || sessionStorage.getItem(ADMIN_SESSION_KEY) || 'null');
            if (!admin || !admin.id) { window.location.replace('login.html'); return; }
            showLoader('Loading...');
            try {
                await waitForSupabase();
                var users = await dbSelect('office_users', { order: { column: 'created_at', ascending: false } });
                var html = '';
                users.forEach(function (u) {
                    html += '<div class="card" style="display:flex;justify-content:space-between;align-items:center;"><div><strong>' + (u.full_name || 'Unnamed') + '</strong><br><span style="font-size:13px;color:#888;">Role: ' + u.role + '</span></div><span class="badge ' + (u.is_active ? 'badge-success' : 'badge-secondary') + '">' + (u.is_active ? 'Active' : 'Inactive') + '</span></div>';
                });
                document.getElementById('users-list').innerHTML = html || '<p style="color:#888;">No office users found</p>';
            } catch (err) { showToast('Error: ' + err.message, 'error'); } finally { hideLoader(); }
        }
        if (localStorage.getItem('erp_admin_dark_mode') === 'true') document.body.classList.add('dark-mode');
        waitForSupabase().then(init).catch(function () { hideLoader(); });
    </script>
</body>
</html>
