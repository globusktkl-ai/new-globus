<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Management — ERP Admin</title>
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>
    <nav class="admin-nav">
        <div class="nav-content">
            <div class="nav-brand">
                <div class="nav-logo">📚</div>
                <div><div class="nav-title">Course Management</div><div class="nav-subtitle">Admin Portal</div></div>
            </div>
            <div class="nav-menu">
                <a href="dashboard.html" class="nav-link">Dashboard</a>
                <button class="nav-btn" onclick="handleLogout()">Logout</button>
            </div>
        </div>
    </nav>

    <div class="admin-container">
        <div class="page-header">
            <h1>📚 Course Management</h1>
            <button class="btn btn-primary" onclick="showAddModal()">➕ Add Course</button>
        </div>

        <div id="courses-list"></div>
    </div>

    <div class="modal-overlay" id="add-modal" style="display:none;">
        <div class="modal-content">
            <div class="modal-header"><h3 id="modal-title">Add Course</h3><button class="modal-close" onclick="closeModal()">×</button></div>
            <div class="modal-body">
                <form id="course-form">
                    <input type="hidden" id="course-id">
                    <div class="form-group"><label class="form-label">Course Name *</label><input type="text" class="form-input" id="course-name" required></div>
                    <div class="form-row">
                        <div class="form-group"><label class="form-label">Course Code *</label><input type="text" class="form-input" id="course-code" required></div>
                        <div class="form-group"><label class="form-label">Duration</label><input type="text" class="form-input" id="course-duration" placeholder="e.g. 6 months"></div>
                    </div>
                    <div class="form-group"><label class="form-label">Total Fee</label><input type="number" class="form-input" id="course-fee" min="0"></div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                <button class="btn btn-primary" onclick="saveCourse()">Save</button>
            </div>
        </div>
    </div>

    <script src="../assets/js/supabase.js"></script>
    <script src="../assets/shared/helpers.js"></script>
    <script src="../assets/shared/ui.js"></script>
    <script src="js/courses.js"></script>
</body>
</html>
