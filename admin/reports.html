<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reports — ERP Admin</title>
    <link rel="stylesheet" href="css/admin.css">
    <link rel="stylesheet" href="css/reports.css">
</head>
<body>
    <nav class="admin-nav">
        <div class="nav-content">
            <div class="nav-brand">
                <div class="nav-logo">📊</div>
                <div>
                    <div class="nav-title">Reports & Analytics</div>
                    <div class="nav-subtitle">Admin Portal</div>
                </div>
            </div>
            <div class="nav-menu">
                <a href="dashboard.html" class="nav-link">Dashboard</a>
                <a href="reports.html" class="nav-link active">Reports</a>
                <a href="settings.html" class="nav-link">Settings</a>
                <button class="nav-btn" onclick="handleLogout()">Logout</button>
            </div>
        </div>
    </nav>

    <div class="admin-container">
        <div class="page-header">
            <h1>📊 Reports & Analytics</h1>
        </div>

        <!-- Financial Overview -->
        <div class="financial-cards" id="financial-cards"></div>

        <!-- Report Categories -->
        <div class="report-categories">
            <div class="report-category active" data-type="collection">
                <div class="category-icon">💰</div>
                <div class="category-name">Fee Collection</div>
                <div class="category-desc">Daily, monthly, yearly</div>
            </div>
            <div class="report-category" data-type="students">
                <div class="category-icon">👥</div>
                <div class="category-name">Students</div>
                <div class="category-desc">Admissions, status, modules</div>
            </div>
            <div class="report-category" data-type="attendance">
                <div class="category-icon">📋</div>
                <div class="category-name">Attendance</div>
                <div class="category-desc">Daily, monthly reports</div>
            </div>
            <div class="report-category" data-type="pending">
                <div class="category-icon">⏳</div>
                <div class="category-name">Pending Fees</div>
                <div class="category-desc">Outstanding balances</div>
            </div>
        </div>

        <!-- Filters -->
        <div class="report-filters">
            <h3 style="margin-bottom:16px;">🔍 Filters</h3>
            <div class="filters-grid">
                <div class="form-group">
                    <label class="form-label">From Date</label>
                    <input type="date" class="form-input" id="from-date">
                </div>
                <div class="form-group">
                    <label class="form-label">To Date</label>
                    <input type="date" class="form-input" id="to-date">
                </div>
                <div class="form-group">
                    <label class="form-label">Course</label>
                    <select class="form-select" id="filter-course">
                        <option value="">All Courses</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Payment Mode</label>
                    <select class="form-select" id="filter-mode">
                        <option value="">All Modes</option>
                        <option value="Cash">Cash</option>
                        <option value="UPI">UPI</option>
                        <option value="Card">Card</option>
                        <option value="Bank Transfer">Bank Transfer</option>
                    </select>
                </div>
            </div>
            <div class="filter-actions">
                <button class="btn btn-primary" onclick="generateReport()">Generate Report</button>
                <button class="btn btn-secondary" onclick="resetFilters()">Reset</button>
            </div>
        </div>

        <!-- Report Output -->
        <div class="report-output" id="report-output" style="display:none;">
            <div class="report-header">
                <h3 id="report-title">Report</h3>
                <div class="export-buttons">
                    <button class="export-btn csv" onclick="exportCSV()">📄 CSV</button>
                    <button class="export-btn print" onclick="window.print()">🖨 Print</button>
                </div>
            </div>
            <div class="report-stats" id="report-stats"></div>
            <div class="table-container">
                <table class="data-table" id="report-table">
                    <thead id="report-thead"></thead>
                    <tbody id="report-tbody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="../assets/js/supabase.js"></script>
    <script src="../assets/shared/helpers.js"></script>
    <script src="../assets/shared/ui.js"></script>
    <script src="../assets/shared/components.js"></script>
    <script src="js/reports.js"></script>
</body>
</html>
