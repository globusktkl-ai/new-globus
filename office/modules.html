<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modules — ERP</title>
    <link rel="stylesheet" href="css/common.css">
    <style>
        .module-card { background: #fff; border-radius: 14px; padding: 20px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); margin-bottom: 14px; display: flex; align-items: center; gap: 16px; }
        .module-num { width: 50px; height: 50px; border-radius: 12px; background: #eaf2fb; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 700; color: #4a90d9; }
        .module-info { flex: 1; }
        .module-info h3 { font-size: 16px; color: #1a3a5c; margin-bottom: 4px; }
        .module-info p { font-size: 13px; color: #888; }
        .module-actions { display: flex; gap: 8px; }
        .add-form { background: #fff; border-radius: 14px; padding: 24px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); margin-bottom: 24px; }
        .add-form h3 { font-size: 17px; color: #1a3a5c; margin-bottom: 16px; }
    </style>
</head>
<body>
    <nav class="top-nav">
        <div>
            <div class="nav-title">Modules</div>
            <div class="nav-subtitle">Course Modules Management</div>
        </div>
        <div class="nav-actions">
            <a href="index.html" class="nav-btn">Dashboard</a>
        </div>
    </nav>

    <div class="page-container">
        <!-- Course Selector -->
        <div class="form-group" style="margin-bottom:20px;">
            <label class="form-label">Select Course</label>
            <select class="form-select" id="course-select">
                <option value="">Select a course...</option>
            </select>
        </div>

        <!-- Add Module Form -->
        <div class="add-form" id="add-form" style="display:none;">
            <h3>➕ Add New Module</h3>
            <form id="module-form">
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Module Number</label>
                        <input type="number" class="form-input" id="module-number" min="1" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Module Name</label>
                        <input type="text" class="form-input" id="module-name" required>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">Description</label>
                    <textarea class="form-textarea" id="module-desc" rows="2"></textarea>
                </div>
                <button type="submit" class="btn btn-primary">Add Module</button>
            </form>
        </div>

        <!-- Modules List -->
        <div id="modules-list"></div>
    </div>

    <script src="../assets/js/supabase.js"></script>
    <script src="../assets/shared/helpers.js"></script>
    <script src="../assets/shared/ui.js"></script>
    <script src="../assets/shared/components.js"></script>
    <script src="js/modules.js"></script>
</body>
</html>
