<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Office Login — ERP</title>
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <div class="login-page">
        <div class="login-card">
            <div class="login-logo">
                <div class="logo-icon" id="logo-icon">G</div>
                <h1 id="login-title">Office Login</h1>
                <p id="login-subtitle">Sign in to your office account</p>
            </div>

            <div class="login-error" id="login-error"></div>

            <form class="login-form" id="login-form" autocomplete="off">
                <div class="form-group">
                    <label class="form-label" for="email">Email</label>
                    <input type="email" id="email" class="form-input" placeholder="Enter your email" required autocomplete="email">
                </div>
                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" class="form-input" placeholder="Enter your password" required autocomplete="current-password">
                        <button type="button" class="password-toggle" id="pwd-toggle">👁</button>
                    </div>
                </div>
                <div class="remember-row">
                    <input type="checkbox" id="remember" checked>
                    <label for="remember">Remember Login</label>
                </div>
                <button type="submit" class="login-btn" id="login-btn">Sign In</button>
            </form>

            <div class="login-footer">
                Don't have an account? <a href="../signup.html">Register here</a>
            </div>
        </div>
    </div>

    <script src="../assets/js/supabase.js"></script>
    <script src="../assets/shared/helpers.js"></script>
    <script src="../assets/shared/ui.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
