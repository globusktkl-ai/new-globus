<!DOCTYPE html>
<html lang="en">
<head>

    <link rel="stylesheet" href="css/common.css">

</head>
<body>

    <nav class="top-nav">
        <div>
            <div class="nav-title" id="nav-title">Office Dashboard</div>
            <div class="nav-subtitle" id="nav-subtitle"></div>
        </div>
        <div class="nav-actions">

        <div class="menu-grid" id="menu-grid">
            <!-- Filled by JS -->

    <script src="../assets/js/supabase.js"></script>
    <script src="../assets/shared/helpers.js"></script>
