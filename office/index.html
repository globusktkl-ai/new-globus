<!DOCTYPE html>

```
<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
    }

    body{
        font-family:Arial,Helvetica,sans-serif;
        background:#f4f6f9;
    }

    .header{
        background:#1a3a5c;
        color:#fff;
        padding:18px 20px;
        display:flex;
        justify-content:space-between;
        align-items:center;
    }

    .header-left{
        display:flex;
        align-items:center;
        gap:12px;
    }

    .header img{
        width:46px;
        height:46px;
        object-fit:contain;
    }

    .header h1{
        font-size:22px;
    }

    .header p{
        font-size:13px;
        opacity:0.85;
    }

    .logout-btn{
        background:#fff;
        color:#1a3a5c;
        border:none;
        padding:10px 16px;
        border-radius:8px;
        font-weight:600;
        cursor:pointer;
    }

    .container{
        padding:20px;
        max-width:1100px;
        margin:auto;
    }

    .welcome{
        margin-bottom:22px;
    }

    .welcome h2{
        color:#1a3a5c;
        margin-bottom:6px;
    }

    .cards{
        display:grid;
        grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
        gap:18px;
        margin-bottom:28px;
    }

    .card{
        background:#fff;
        border-radius:16px;
        padding:22px;
        box-shadow:0 6px 18px rgba(0,0,0,0.08);
    }

    .card h3{
        color:#666;
        font-size:14px;
        margin-bottom:12px;
    }

    .card .value{
        font-size:32px;
        font-weight:700;
        color:#1a3a5c;
    }

    .menu{
        display:grid;
        grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
        gap:16px;
    }

    .menu a{
        background:#fff;
        border-radius:14px;
        padding:20px;
        text-decoration:none;
        color:#1a3a5c;
        font-weight:600;
        box-shadow:0 6px 18px rgba(0,0,0,0.08);
        transition:transform .15s;
    }

    .menu a:hover{
        transform:translateY(-2px);
    }
</style>
```

</head>

</div>

<script src="../assets/js/supabase.js"></script>

<script>
(async function(){

    if(localStorage.getItem('office_logged_in') !== 'true'){
        window.location.replace('login.html');
        return;
    }

    document.getElementById('welcome-name').textContent =
        'Welcome, ' + (localStorage.getItem('office_user_name') || 'Office');

    const sb = window.supabaseClient;

    if(!sb) return;

    try{

        const {count:students} = await sb
            .from('students')
            .select('*',{count:'exact',head:true});

        document.getElementById('student-count').textContent =
            students || 0;

        const {data:today} = await sb
            .from('fee_payments')
            .select('amount')
            .eq('payment_date', new Date().toISOString().slice(0,10));

        const total = (today || []).reduce((s,r)=>s+Number(r.amount),0);

        document.getElementById('today-collection').textContent =
            '₹' + total.toLocaleString();

        const {data:pending} = await sb
            .from('students')
            .select('balance');

        const pendingTotal =
            (pending || []).reduce((s,r)=>s+Number(r.balance),0);

        document.getElementById('pending-fees').textContent =
            '₹' + pendingTotal.toLocaleString();

    }catch(e){
        console.error(e);
    }

})();

function logout(){
    localStorage.removeItem('office_logged_in');
    localStorage.removeItem('office_user_id');
    localStorage.removeItem('office_user_name');
    localStorage.removeItem('office_user_role');
    localStorage.removeItem('office_remember');
    window.location.replace('login.html');
}
</script>

</body>
